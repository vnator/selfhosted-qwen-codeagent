version: '3.8'

services:
  # Servidor de Inferência LLM
  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Configuração para habilitar processamento na GPU via NVIDIA CUDA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # Banco de Dados Vetorial ultrarrápido e leve
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # API REST
      - "6334:6334" # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
  # Orquestrador do Agente e Interface (com pipeline RAG embutido)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agent_ui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=qdrant
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
      - qdrant

volumes:
  ollama_data:
  qdrant_data:
  open_webui_data:
